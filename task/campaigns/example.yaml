schema_version: 1
name: mmlu-harness-comparison

models:
  - openai-compatible

benchmarks:
  - id: mmlu
    sample:
      n: 10
      seed: 20260822

harnesses:
  - langgraph
  - openai-agents

repetitions: 1
matrix:
  exclude: []

execution:
  n_concurrent_trials: 8
  n_active_cells: 2
  n_concurrent_sandboxes: 2
  n_concurrent_graders: 4
  n_concurrent_uploads: 4
  queue_capacity: 16
  cancellation_grace_seconds: 30
  timeout_seconds: 300
  retry:
    max_retries: 0

artifacts:
  retain: failures
