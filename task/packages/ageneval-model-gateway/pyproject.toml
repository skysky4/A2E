[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ageneval-model-gateway"
version = "0.1.0"
description = "Model profiles and compatibility middleware for A2E campaigns"
requires-python = ">=3.10,<3.15"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ageneval"]

[tool.hatch.build.targets.sdist]
include = ["src/ageneval"]
