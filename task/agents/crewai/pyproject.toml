[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ageneval-task-agent-crewai"
version = "0.1.0"
description = "A2E crewai agent — dataset-agnostic AgentBinding runner powered by CrewAI"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Shanghai AI Lab" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "ageneval-task-core>=0.1.0",
    "openinference-instrumentation-crewai==0.1.16",
    # Keep CrewAI aligned with the instrumentation package's supported range.
    "crewai>=1.10.1",
    "openai>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ageneval"]

[tool.hatch.build.targets.sdist]
include = ["src/ageneval", "README.md"]
