schema_version: 1
id: traject-bench
kind: tool
loader:
  entrypoint: ageneval.task.datasets.traject_bench.loader:load_traject_bench_tasks
  accepts: [split, n]
binding:
  entrypoint: ageneval.task.datasets.traject_bench.binding:build_traject_bench_binding
grader:
  entrypoint: ageneval.task.datasets.traject_bench.grader:GRADER
defaults: {max_turns: 8, max_tokens: 4096, llm_timeout: 180, run_deadline: 1800}
agent_overrides: {max_turns: 8, max_steps: 8}
resources: {docker: false, network: false}
