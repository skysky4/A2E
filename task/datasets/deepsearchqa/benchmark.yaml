schema_version: 1
id: deepsearchqa
kind: tool
loader:
  entrypoint: ageneval.task.datasets.deepsearchqa.loader:load_deepsearchqa_tasks
  accepts: [split, n]
binding:
  entrypoint: ageneval.task.datasets.deepsearchqa.binding:build_deepsearchqa_binding
grader:
  entrypoint: ageneval.task.datasets.deepsearchqa.grader:GRADER
session:
  entrypoint: ageneval.task.datasets.deepsearchqa.session:wrap_dsqa_official_session
defaults: {max_turns: 20, max_tokens: 4096, llm_timeout: 180, run_deadline: 1800}
agent_overrides: {max_turns: 20, max_steps: 20}
resources: {docker: false, network: true}
